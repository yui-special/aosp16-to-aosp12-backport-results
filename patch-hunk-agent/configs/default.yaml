# Patch Hunk Dependency Grouping Agent - default settings.
# Model names and endpoints live in models.yaml; secrets come from the environment.
patch_hunk_agent:
  analysis_version: "1.0"

  logging:
    level: INFO
    record_run: true
    log_file: null
    record_file: null

  output:
    directory: results

  context:
    enabled: true
    context_radius: 40
    max_lines_per_block: 120
    max_total_chars: 24000
    max_symbol_queries: 12
    max_search_results: 20
    include_enclosing_function: true
    allow_search: true
    search_extensions: [".c", ".h", ".cc", ".cpp", ".hpp", ".java", ".py", ".js", ".ts", ".go", ".rs", ".kt"]

  evidence:
    mode: heuristic
    include_context_references: true

  analyzer:
    provider: mock-heuristic
    model: mock-heuristic
    temperature: 0.0
    max_tokens: 4096
    max_format_retries: 2
    max_evidence_rounds: 1
    max_pairs_per_call: 8
    max_candidate_pairs: 200
    include_no_signal_pairs: true
    log_raw_responses: true
    code_context_chars: 1600
    compact_schema: true
    include_unavailable_context: false
    max_payload_chars: 120000

  grouping:
    # global     = the model proposes the work packages; the graph validates/repairs them
    # components = the implementation document's connected-component algorithm
    mode: global
    max_group_size: 8
    max_split_rounds: 2
    max_partition_retries: 1
    promote_conditional: true
    promoted_categories: [DEFINITION_USE, INTERFACE_SIGNATURE]
    require_target_absent_for_promotion: true
    require_locatable_evidence_for_promotion: true
    repartition_rounds: 2

  validator:
    require_evidence_for_strong: true
    require_separation_risk_for_strong: true
    downgrade_strong_when_target_present: true
    downgrade_strong_when_pending_evidence: true
    cross_check_context: true
    weak_when_no_evidence: true

  partition_validator:
    require_contiguous_group_ids: false
    treat_missing_analysis_as_partial: true
